
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gamevora - Game Store</title>
  <style>
    body {
      margin: 0;
      background: #100e19;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header {
      padding: 35px 15px;
      background: #211b35;
    }
    .card {
      margin: 25px auto;
      padding: 25px;

      background: #282239;
      border-radius: 15px;
    }
    button {
      padding: 12px 25px;
      background: #8755ed;
      color: white;
      border: 0;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>GAMEVORA</h1>
    <p>Your Digital Game Store</p>
  </header>

  <div class="card">
    <h2>Highgame Island</h2>
    <p>Gold Coin Store</p>
    <button>Explore Store</button>
  </div>

  <p>Powered by Gamevora</p>
</body>
</html>
